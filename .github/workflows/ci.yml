name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: ruff check src tests
      - name: Reject embedded credentials and private workspace paths
        run: |
          ! git grep -E \
          "SPOTIFY_CLIENT_SECRET[[:space:]]*=[[:space:]]*['\"][A-Za-z0-9]|\\.djlearn|/home/achernetz" -- \
          ':!docs/**' ':!tests/**' ':!.gitignore' '!:.github/**' ':!README.md' ':!CHANGELOG.md' ':!src/cratepilot/legacy/**'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
