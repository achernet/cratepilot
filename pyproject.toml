[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cratepilot"
version = "0.3.0"
description = "Provenance-aware music discovery, explainable DJ-set planning, and Rekordbox preparation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Chernetz" }]
dependencies = [
  "fastapi>=0.115,<1",
  "librosa>=0.10,<1",
  "numpy>=1.26,<3",
  "platformdirs>=4,<5",
  "scipy>=1.11,<2",
  "soundfile>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.9,<1"]
discovery = ["keyring>=25,<26"]

[project.scripts]
cratepilot = "cratepilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cratepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["src/cratepilot/legacy", "tests/test_legacy_transition_learning.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
